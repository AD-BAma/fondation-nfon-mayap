<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="leopardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Shield Glow -->
  <path d="M50 4 C68 4 86 16 86 38 C86 64 50 94 50 94 C50 94 14 64 14 38 C14 16 32 4 50 4 Z" fill="#ffffff" stroke="#0d5c3a" stroke-width="2.5" filter="url(#shadow)" />
  
  <!-- Leopard Head Shape -->
  <g transform="translate(0, -3)">
    <!-- Ears -->
    <path d="M30 22 C26 15 34 11 39 18 Z" fill="#ca8a04" stroke="#1f2937" stroke-width="1.5" />
    <path d="M70 22 C74 15 66 11 61 18 Z" fill="#ca8a04" stroke="#1f2937" stroke-width="1.5" />
    <path d="M32 20 C29 16 34 14 37 18 Z" fill="#fef08a" />
    <path d="M68 20 C71 16 66 14 63 18 Z" fill="#fef08a" />

    <!-- Head Base -->
    <path d="M32 24 C22 36 24 50 33 58 C40 64 45 68 50 68 C55 68 60 64 67 58 C76 50 78 36 68 24 C60 19 40 19 32 24 Z" fill="url(#leopardGrad)" stroke="#111827" stroke-width="1.8" />
    
    <!-- Cheeks & Muzzle White areas -->
    <ellipse cx="43" cy="54" rx="7" ry="5.5" fill="#fefce8" />
    <ellipse cx="57" cy="54" rx="7" ry="5.5" fill="#fefce8" />
    <path d="M44 48 C47 43 53 43 56 48 C52 50 48 50 44 48 Z" fill="#fefce8" />

    <!-- Nose -->
    <path d="M47 50 L53 50 L50 54 Z" fill="#1e293b" />

    <!-- Eyes (Fierce, Wise, Noble) -->
    <path d="M36 38 C40 34 44 38 43 40 C39 41 36 40 36 38 Z" fill="#15803d" stroke="#0f172a" stroke-width="1.2" />
    <circle cx="40" cy="38" r="1.4" fill="#052e16" />
    <circle cx="39.2" cy="37.2" r="0.6" fill="#ffffff" />

    <path d="M64 38 C60 34 56 38 57 40 C61 41 64 40 64 38 Z" fill="#15803d" stroke="#0f172a" stroke-width="1.2" />
    <circle cx="60" cy="38" r="1.4" fill="#052e16" />
    <circle cx="59.2" cy="37.2" r="0.6" fill="#ffffff" />

    <!-- Rosettes / Spots -->
    <!-- Forehead -->
    <circle cx="50" cy="26" r="1.5" fill="#1f2937" />
    <circle cx="45" cy="30" r="1.3" fill="#1f2937" />
    <circle cx="55" cy="30" r="1.3" fill="#1f2937" />
    <circle cx="50" cy="34" r="1.6" fill="#1f2937" />
    <!-- Cheeks Spots -->
    <path d="M28 36 C27 34 30 33 31 35 C30 37 28 38 28 36 Z" fill="#1f2937" />
    <path d="M72 36 C73 34 70 33 69 35 C70 37 72 38 72 36 Z" fill="#1f2937" />
    <circle cx="28" cy="44" r="1.4" fill="#1f2937" />
    <circle cx="72" cy="44" r="1.4" fill="#1f2937" />
    <circle cx="33" cy="48" r="1.5" fill="#1f2937" />
    <circle cx="67" cy="48" r="1.5" fill="#1f2937" />
    <!-- Whiskers Dots -->
    <circle cx="41" cy="53" r="0.7" fill="#1f2937" />
    <circle cx="44" cy="54.5" r="0.7" fill="#1f2937" />
    <circle cx="41" cy="56" r="0.7" fill="#1f2937" />
    <circle cx="59" cy="53" r="0.7" fill="#1f2937" />
    <circle cx="56" cy="54.5" r="0.7" fill="#1f2937" />
    <circle cx="59" cy="56" r="0.7" fill="#1f2937" />
  </g>

  <!-- Green Protective Palm Leaves / Laurel at the Base -->
  <g fill="url(#leafGrad)">
    <path d="M50 78 C38 76 26 68 22 56 C26 64 36 70 48 72 Z" />
    <path d="M50 84 C34 82 22 72 18 62 C24 72 36 78 48 80 Z" />
    <path d="M50 78 C62 76 74 68 78 56 C74 64 64 70 52 72 Z" />
    <path d="M50 84 C66 82 78 72 82 62 C76 72 64 78 52 80 Z" />
    <path d="M50 90 L46 80 L54 80 Z" fill="#047857" />
  </g>
</svg>
